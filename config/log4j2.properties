# Silences the usual Spark driver console spam (NativeCodeLoader warnings,
# Ivy resolution logs, shuffle/codegen INFO lines, etc.) so `rich` output in
# pg_extract_incremental.py stays clean. Referenced automatically via
# spark.driver.extraJavaOptions in build_spark_session().

rootLogger.level = error
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# A few known-chatty loggers, muted explicitly in case rootLogger gets
# overridden somewhere else.
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = error

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = error

logger.spark.name = org.apache.spark
logger.spark.level = error

logger.delta.name = io.delta
logger.delta.level = error

logger.uc.name = io.unitycatalog
logger.uc.level = error

# Suppress noisy first-run checks (DESCRIBE on not-yet-created bronze tables) and Windows temp-file delete race
logger.sqlquery.name = org.apache.spark.sql.SQLQueryContextLogger
logger.sqlquery.level = off

logger.shutdown.name = org.apache.spark.util.ShutdownHookManager
logger.shutdown.level = off