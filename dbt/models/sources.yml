version: 2

sources:
  # ---------------------------------------------------------------------------
  # Bronze source — used by all targets.
  #
  # dev / prod (Databricks): dbt resolves the table against the Unity Catalog
  # using DATABRICKS_CATALOG and DATABRICKS_SCHEMA_BRONZE env vars.
  #
  # local (DuckDB): dbt-duckdb reads meta.external_location as a read-only
  # view over delta/bronze/*.parquet. No Databricks connection required.
  # To use:  dbt build --target local --project-dir dbt --profiles-dir dbt
  # ---------------------------------------------------------------------------
  - name: bronze
    database: "{{ env_var('DATABRICKS_CATALOG', 'freightlake') }}"
    schema: "{{ env_var('DATABRICKS_SCHEMA_BRONZE', 'bronze') }}"
    tables:
      - name: customers
        config:
          meta:
            external_location: "read_parquet('delta/bronze/customers.parquet')"
      - name: drivers
        config:
          meta:
            external_location: "read_parquet('delta/bronze/drivers.parquet')"
      - name: trucks
        config:
          meta:
            external_location: "read_parquet('delta/bronze/trucks.parquet')"
      - name: trailers
        config:
          meta:
            external_location: "read_parquet('delta/bronze/trailers.parquet')"
      - name: facilities
        config:
          meta:
            external_location: "read_parquet('delta/bronze/facilities.parquet')"
      - name: routes
        config:
          meta:
            external_location: "read_parquet('delta/bronze/routes.parquet')"
      - name: loads
        config:
          meta:
            external_location: "read_parquet('delta/bronze/loads.parquet')"
      - name: trips
        config:
          meta:
            external_location: "read_parquet('delta/bronze/trips.parquet')"
      - name: fuel_purchases
        config:
          meta:
            external_location: "read_parquet('delta/bronze/fuel_purchases.parquet')"
      - name: delivery_events
        config:
          meta:
            external_location: "read_parquet('delta/bronze/delivery_events.parquet')"
      - name: safety_incidents
        config:
          meta:
            external_location: "read_parquet('delta/bronze/safety_incidents.parquet')"
      - name: maintenance_records
        config:
          meta:
            external_location: "read_parquet('delta/bronze/maintenance_records.parquet')"
    # freshness: warn_after 24h, error_after 48h on _loaded_at — see ARCHITECTURE.md SLA section
    # dbt source freshness check would be: dbt source freshness --select source:bronze
    # Currently disabled for dbt-fusion parse compatibility; enable when warehouse has sql scope
