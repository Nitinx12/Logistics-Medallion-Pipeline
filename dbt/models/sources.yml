version: 2

sources:
  - name: bronze
    database: "{{ env_var('DATABRICKS_CATALOG', 'freightlake') }}"
    schema: "{{ env_var('DATABRICKS_SCHEMA_BRONZE', 'bronze') }}"
    tables:
      - name: customers
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
        loaded_at_field: _loaded_at
      - name: drivers
      - name: trucks
      - name: trailers
      - name: facilities
      - name: routes
      - name: loads
      - name: trips
      - name: fuel_purchases
      - name: delivery_events
        loaded_at_field: _loaded_at
      - name: safety_incidents
      - name: maintenance_records
