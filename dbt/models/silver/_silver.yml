version: 2

models:
  - name: customers
    description: Silver customers dimension cleansed and deduplicated from bronze customers source. One row per customer id with latest updated at and watermark handling.
    columns:
      - name: customer_id
        description: Primary key for customers. Unique identifier from source system.
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
          - no_empty_strings:
              config:
                severity: error
          - no_white_spaces:
              config:
                severity: error
          - matches_regex:
              arguments:
                regex: '^[A-Za-z0-9_-]+$'
              config:
                severity: error
      - name: customer_name
        description: Customer display name as provided by source.
        tests:
          - not_null:
              config:
                severity: error
          - no_empty_strings:
              config:
                severity: error
          - no_white_spaces:
              config:
                severity: error
      - name: customer_type
        description: Customer classification grouping in source.
        tests:
          - no_empty_strings
          - no_white_spaces
          - accepted_values:
              arguments:
                values: ['Contract', 'Dedicated', 'Spot']
      - name: credit_terms_days
        description: Payment terms in days agreed for customer.
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 120
              config:
                severity: error
          - not_null:
              config:
                severity: warn
      - name: primary_freight_type
        description: Main freight mode used by customer.
        tests:
          - no_empty_strings
          - no_white_spaces
          - accepted_values:
              arguments:
                values: ['Automotive', 'Consumer Goods', 'Electronics', 'Food/Beverage', 'General', 'Retail']
      - name: account_status
        description: Current account lifecycle status.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
          - accepted_values:
              arguments:
                values: ['Active', 'Inactive']
      - name: contract_start_date
        description: Date when contract started with customer.
        tests:
          - no_future_dates
          - not_null:
              config:
                severity: warn
      - name: annual_revenue_potential
        description: Estimated annual revenue potential for customer in dollars.
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100000000
          - not_null:
              config:
                severity: warn
      - name: updated_at
        description: Last update timestamp from source system used for incremental watermark.
        tests:
          - not_null:
              config:
                severity: error
          - no_future_dates:
              config:
                severity: error

  - name: drivers
    description: Silver drivers dimension with employment and license attributes.
    columns:
      - name: driver_id
        description: Primary key for drivers.
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
          - no_empty_strings
          - no_white_spaces
          - matches_regex:
              arguments:
                regex: '^[A-Za-z0-9_-]+$'
      - name: first_name
        description: Driver first name.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
          - matches_regex:
              arguments:
                regex: '^[A-Za-z -]+$'
      - name: last_name
        description: Driver last name.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
          - matches_regex:
              arguments:
                regex: '^[A-Za-z -]+$'
      - name: hire_date
        description: Date driver was hired.
        tests:
          - not_null
          - no_future_dates
      - name: termination_date
        description: Date driver employment ended if applicable.
        tests:
          - no_future_dates
      - name: license_number
        description: Commercial driver license number.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
          - matches_regex:
              arguments:
                regex: '^[A-Za-z0-9-]+$'
      - name: license_state
        description: State that issued the license as two letter code.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
          - matches_regex:
              arguments:
                regex: '^[A-Z]{2}$'
          - accepted_values:
              arguments:
                values: ['AZ', 'CA', 'CO', 'FL', 'GA', 'IL', 'IN', 'MI', 'MN', 'MO', 'NC', 'NE', 'NV', 'NY', 'OH', 'OK', 'OR', 'PA', 'TN', 'TX', 'UT', 'WA', 'WI']
      - name: date_of_birth
        description: Driver birth date.
        tests:
          - no_future_dates
          - not_null:
              config:
                severity: warn
      - name: home_terminal
        description: Home terminal location for driver.
        tests:
          - no_empty_strings
          - no_white_spaces
          - accepted_values:
              arguments:
                values: ['Atlanta', 'Charlotte', 'Chicago', 'Columbus', 'Dallas', 'Denver', 'Detroit', 'Houston', 'Indianapolis', 'Kansas City', 'Las Vegas', 'Los Angeles', 'Memphis', 'Miami', 'Milwaukee', 'Minneapolis', 'Nashville', 'New York', 'Oklahoma City', 'Omaha', 'Philadelphia', 'Phoenix', 'Portland', 'Salt Lake City', 'Seattle']
      - name: employment_status
        description: Current employment status.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
          - accepted_values:
              arguments:
                values: ['Active', 'Terminated']
      - name: cdl_class
        description: Commercial license class.
        tests:
          - accepted_values:
              arguments:
                values: ['A']
          - no_white_spaces
      - name: years_experience
        description: Years of driving experience.
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 60
          - not_null:
              config:
                severity: warn
      - name: updated_at
        description: Last update timestamp for incremental processing.
        tests:
          - not_null:
              config:
                severity: error
          - no_future_dates:
              config:
                severity: error

  - name: facilities
    description: Silver facilities dimension for warehouses and terminals.
    columns:
      - name: facility_id
        description: Primary key for facilities.
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
          - no_empty_strings
          - no_white_spaces
      - name: facility_name
        description: Facility display name.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
      - name: facility_type
        description: Facility functional type.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
          - accepted_values:
              arguments:
                values: ['Cross-Dock', 'Distribution Center', 'Terminal', 'Warehouse']
      - name: city
        description: Facility city name.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
          - accepted_values:
              arguments:
                values: ['Atlanta', 'Charlotte', 'Chicago', 'Dallas', 'Denver', 'Detroit', 'Houston', 'Indianapolis', 'Kansas City', 'Las Vegas', 'Los Angeles', 'Miami', 'Milwaukee', 'Nashville', 'New York', 'Oklahoma City', 'Omaha', 'Philadelphia', 'Phoenix', 'Portland', 'Salt Lake City']
      - name: state
        description: Facility state code.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
          - matches_regex:
              arguments:
                regex: '^[A-Z]{2}$'
          - accepted_values:
              arguments:
                values: ['AZ', 'CA', 'CO', 'FL', 'GA', 'IL', 'IN', 'MI', 'MO', 'NC', 'NE', 'NV', 'NY', 'OK', 'OR', 'PA', 'TN', 'TX', 'UT', 'WI']
      - name: latitude
        description: Geographic latitude coordinate.
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: -90
                max_value: 90
      - name: longitude
        description: Geographic longitude coordinate.
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: -180
                max_value: 180
      - name: dock_doors
        description: Number of dock doors at facility.
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 500
          - not_null:
              config:
                severity: warn
      - name: operating_hours
        description: Operating hours description.
        tests:
          - no_empty_strings:
              config:
                severity: warn
      - name: updated_at
        description: Last update timestamp.
        tests:
          - not_null:
              config:
                severity: error
          - no_future_dates:
              config:
                severity: error

  - name: routes
    description: Silver routes master data with origin and destination and rate attributes.
    columns:
      - name: route_id
        description: Primary key for routes.
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
          - no_empty_strings
          - no_white_spaces
      - name: origin_city
        description: Origin city name.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
      - name: origin_state
        description: Origin state code two letters.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
          - matches_regex:
              arguments:
                regex: '^[A-Z]{2}$'
      - name: destination_city
        description: Destination city name.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
      - name: destination_state
        description: Destination state code two letters.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
          - matches_regex:
              arguments:
                regex: '^[A-Z]{2}$'
      - name: typical_distance_miles
        description: Typical distance for route in miles.
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 5000
      - name: base_rate_per_mile
        description: Base rate in dollars per mile.
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 20
      - name: fuel_surcharge_rate
        description: Fuel surcharge rate per mile.
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 5
      - name: typical_transit_days
        description: Typical transit time in days.
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 30
          - not_null:
              config:
                severity: warn
      - name: updated_at
        description: Last update timestamp.
        tests:
          - not_null:
              config:
                severity: error
          - no_future_dates:
              config:
                severity: error

  - name: trucks
    description: Silver trucks dimension with acquisition and status attributes.
    columns:
      - name: truck_id
        description: Primary key for trucks.
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
          - no_empty_strings
          - no_white_spaces
      - name: unit_number
        description: Business visible unit number for truck.
        tests:
          - not_null
          - unique
          - no_empty_strings
          - no_white_spaces
      - name: make
        description: Truck manufacturer make.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
      - name: model_year
        description: Model year of truck.
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1990
                max_value: 2027
      - name: vin
        description: Vehicle identification number seventeen characters.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
          - matches_regex:
              arguments:
                regex: '^[A-HJ-NPR-Z0-9]{17}$'
      - name: acquisition_date
        description: Date truck was acquired.
        tests:
          - not_null
          - no_future_dates
      - name: acquisition_mileage
        description: Odometer at acquisition.
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 2000000
      - name: fuel_type
        description: Fuel type used by truck.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Diesel', 'CNG', 'Electric', 'Hybrid', 'Gasoline']
          - no_empty_strings
          - no_white_spaces
      - name: tank_capacity_gallons
        description: Fuel tank capacity in gallons.
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 300
      - name: status
        description: Current operational status of truck.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
          - accepted_values:
              arguments:
                values: ['Active', 'Inactive', 'Maintenance', 'Retired', 'Available']
      - name: home_terminal
        description: Home terminal for truck assignment.
        tests:
          - no_empty_strings:
              config:
                severity: warn
          - no_white_spaces
      - name: updated_at
        description: Last update timestamp.
        tests:
          - not_null:
              config:
                severity: error
          - no_future_dates:
              config:
                severity: error

  - name: trailers
    description: Silver trailers dimension.
    columns:
      - name: trailer_id
        description: Primary key for trailers.
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
          - no_empty_strings
          - no_white_spaces
      - name: trailer_number
        description: Business visible trailer number.
        tests:
          - not_null
          - unique:
              config:
                severity: warn
          - no_empty_strings
          - no_white_spaces
      - name: trailer_type
        description: Trailer functional type.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Dry Van', 'Reefer', 'Flatbed', 'Tanker', 'Container']
              config:
                severity: warn
          - no_empty_strings
          - no_white_spaces
      - name: length_feet
        description: Trailer length in feet.
        tests:
          - accepted_range:
              arguments:
                min_value: 20
                max_value: 100
          - not_null
      - name: model_year
        description: Model year of trailer.
        tests:
          - accepted_range:
              arguments:
                min_value: 1990
                max_value: 2027
      - name: vin
        description: Vehicle identification number for trailer.
        tests:
          - no_empty_strings
          - no_white_spaces
          - matches_regex:
              arguments:
                regex: '^[A-HJ-NPR-Z0-9]{17}$'
              config:
                severity: warn
      - name: acquisition_date
        description: Date trailer was acquired.
        tests:
          - no_future_dates
      - name: status
        description: Current status of trailer.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Active', 'Inactive', 'Maintenance', 'Retired', 'Available']
          - no_empty_strings
          - no_white_spaces
      - name: current_location
        description: Current location description for trailer.
        tests:
          - no_empty_strings:
              config:
                severity: warn
      - name: updated_at
        description: Last update timestamp.
        tests:
          - not_null:
              config:
                severity: error
          - no_future_dates:
              config:
                severity: error

  - name: loads
    description: Silver loads fact style dimension with customer and route links and financial amounts.
    columns:
      - name: load_id
        description: Primary key for loads.
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
          - no_empty_strings
          - no_white_spaces
      - name: customer_id
        description: Customer owning the load.
        tests:
          - not_null:
              config:
                severity: error
          - no_empty_strings
          - no_white_spaces
          - relationships:
              arguments:
                to: ref('customers')
                field: customer_id
              config:
                severity: error
          - no_orphan_rows:
              arguments:
                parent_model: ref('customers')
                parent_column: customer_id
              config:
                severity: error
      - name: route_id
        description: Route assigned to load.
        tests:
          - no_empty_strings:
              config:
                severity: warn
          - no_white_spaces
          - relationships:
              arguments:
                to: ref('routes')
                field: route_id
              config:
                severity: warn
          - no_orphan_rows:
              arguments:
                parent_model: ref('routes')
                parent_column: route_id
              config:
                severity: warn
      - name: load_date
        description: Date load was created.
        tests:
          - not_null
          - no_future_dates
      - name: load_type
        description: Load categorization by size and mode.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Dry Van', 'Refrigerated']
          - no_empty_strings
          - no_white_spaces
      - name: weight_lbs
        description: Weight of load in pounds.
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 80000
      - name: pieces
        description: Number of pieces in load.
        tests:
          - accepted_range:
              arguments:
                min_value: 1
                max_value: 1000
          - not_null:
              config:
                severity: warn
      - name: revenue
        description: Revenue for load in dollars.
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100000
      - name: fuel_surcharge
        description: Fuel surcharge amount in dollars.
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 10000
      - name: accessorial_charges
        description: Additional accessorial charges in dollars.
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 10000
      - name: load_status
        description: Current lifecycle status of load.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Completed']
          - no_empty_strings
          - no_white_spaces
      - name: booking_type
        description: Booking channel for load.
        tests:
          - accepted_values:
              arguments:
                values: ['Contract', 'Dedicated', 'Spot']
          - no_empty_strings:
              config:
                severity: warn
          - no_white_spaces
      - name: updated_at
        description: Last update timestamp.
        tests:
          - not_null:
              config:
                severity: error
          - no_future_dates:
              config:
                severity: error

  - name: trips
    description: Silver trips fact table linking load driver truck and trailer with performance metrics.
    columns:
      - name: trip_id
        description: Primary key for trips.
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
          - no_empty_strings
          - no_white_spaces
      - name: load_id
        description: Load associated with trip.
        tests:
          - not_null
          - no_empty_strings
          - no_white_spaces
          - relationships:
              arguments:
                to: ref('loads')
                field: load_id
              config:
                severity: error
          - no_orphan_rows:
              arguments:
                parent_model: ref('loads')
                parent_column: load_id
      - name: driver_id
        description: Driver assigned to trip.
        tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('drivers')
                field: driver_id
              config:
                severity: warn
          - no_orphan_rows:
              arguments:
                parent_model: ref('drivers')
                parent_column: driver_id
              config:
                severity: warn
      - name: truck_id
        description: Truck assigned to trip.
        tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('trucks')
                field: truck_id
              config:
                severity: warn
          - no_orphan_rows:
              arguments:
                parent_model: ref('trucks')
                parent_column: truck_id
              config:
                severity: warn
      - name: trailer_id
        description: Trailer assigned to trip.
        tests:
          - relationships:
              arguments:
                to: ref('trailers')
                field: trailer_id
              config:
                severity: warn
          - no_orphan_rows:
              arguments:
                parent_model: ref('trailers')
                parent_column: trailer_id
              config:
                severity: warn
      - name: dispatch_date
        description: Date trip was dispatched.
        tests:
          - not_null
          - no_future_dates
      - name: actual_distance_miles
        description: Actual distance traveled in miles.
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 5000
          - not_null:
              config:
                severity: warn
      - name: actual_duration_hours
        description: Actual duration in hours.
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 500
      - name: fuel_gallons_used
        description: Fuel consumed on trip in gallons.
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1000
      - name: average_mpg
        description: Average miles per gallon achieved.
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 30
      - name: idle_time_hours
        description: Idle time during trip in hours.
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: trip_status
        description: Current status of trip.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Scheduled', 'Dispatched', 'In Transit', 'Delivered', 'Cancelled', 'Planned']
              config:
                severity: warn
          - no_empty_strings
          - no_white_spaces
      - name: updated_at
        description: Last update timestamp.
        tests:
          - not_null:
              config:
                severity: error
          - no_future_dates:
              config:
                severity: error

  - name: fuel_purchases
    description: Silver fuel purchases events linked to trip and vehicle.
    columns:
      - name: fuel_purchase_id
        description: Primary key for fuel purchases.
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
          - no_empty_strings
          - no_white_spaces
      - name: trip_id
        description: Trip during which fuel was purchased.
        tests:
          - relationships:
              arguments:
                to: ref('trips')
                field: trip_id
              config:
                severity: warn
          - no_orphan_rows:
              arguments:
                parent_model: ref('trips')
                parent_column: trip_id
              config:
                severity: warn
          - no_empty_strings:
              config:
                severity: warn
      - name: truck_id
        description: Truck that received fuel.
        tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('trucks')
                field: truck_id
              config:
                severity: warn
          - no_orphan_rows:
              arguments:
                parent_model: ref('trucks')
                parent_column: truck_id
              config:
                severity: warn
      - name: driver_id
        description: Driver who made purchase.
        tests:
          - relationships:
              arguments:
                to: ref('drivers')
                field: driver_id
              config:
                severity: warn
          - no_orphan_rows:
              arguments:
                parent_model: ref('drivers')
                parent_column: driver_id
              config:
                severity: warn
      - name: purchase_date
        description: Date of fuel purchase.
        tests:
          - not_null
          - no_future_dates
      - name: location_city
        description: City where fuel was purchased.
        tests:
          - no_empty_strings:
              config:
                severity: warn
          - no_white_spaces
          - accepted_values:
              arguments:
                values: ['Atlanta', 'Charlotte', 'Chicago', 'Columbus', 'Dallas', 'Denver', 'Detroit', 'Houston', 'Indianapolis', 'Kansas City', 'Las Vegas', 'Los Angeles', 'Memphis', 'Miami', 'Milwaukee', 'Minneapolis', 'Nashville', 'New York', 'Oklahoma City', 'Omaha', 'Philadelphia', 'Phoenix', 'Portland', 'Salt Lake City', 'Seattle']
      - name: location_state
        description: State where fuel was purchased.
        tests:
          - matches_regex:
              arguments:
                regex: '^[A-Z]{2}$'
              config:
                severity: warn
          - no_white_spaces
          - accepted_values:
              arguments:
                values: ['AZ', 'CA', 'CO', 'FL', 'GA', 'IL', 'IN', 'MI', 'MN', 'MO', 'NC', 'NE', 'NV', 'NY', 'OH', 'OK', 'OR', 'PA', 'TN', 'TX', 'UT', 'WA', 'WI']
      - name: gallons
        description: Gallons purchased.
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 500
      - name: price_per_gallon
        description: Price per gallon in dollars.
        tests:
          - not_null
          - accepted_range:
