version: 2

models:
  # ---------------------------------------------------------------------------
  # MetricFlow time spine — required by dbt Semantic Layer (dbt >= 1.6).
  # Declares date_day as the standard granularity column so MetricFlow can
  # resolve time-series aggregations without a separate service.
  # ---------------------------------------------------------------------------
  - name: metricflow_time_spine
    description: Calendar spine table used by MetricFlow for time-series metrics.
    config:
      time_spine:
        standard_granularity_column: date_day
    columns:
      - name: date_day
        description: One row per calendar day from 2020-01-01 to 2030-12-31.
        granularity: day
        tests: [not_null, unique]

  - name: dim_customer
    description: Conformed customer dimension Type 1 from stg_customers.
    columns:
      - name: customer_id
        description: Natural key customers.customer_id.
        tests: [not_null, unique]
      - name: customer_name
        description: Trimmed customer name.
      - name: customer_type
        description: Customer type contract or dedicated or spot.
      - name: account_status
        description: Account status active or inactive.
      - name: contract_start_date
        description: Contract start date.

  - name: dim_warehouse
    description: Conformed warehouse dimension Type 1 from stg_facilities.
    columns:
      - name: warehouse_id
        description: Natural key facilities.facility_id.
        tests: [not_null, unique]
      - name: warehouse_name
        description: Facility name.
      - name: warehouse_type
        description: Facility type cross dock or distribution center or terminal or warehouse.
      - name: city
        description: City.
      - name: state
        description: State code.

  - name: dim_route
    description: Conformed route dimension Type 1 from stg_routes.
    columns:
      - name: route_id
        description: Natural key routes.route_id.
        tests: [not_null, unique]
      - name: origin_city
        description: Origin city.
      - name: destination_city
        description: Destination city.
      - name: distance_miles
        description: Typical distance miles.
      - name: rate_per_mile
        description: Base rate per mile.

  - name: dim_date
    description: Calendar dimension 2022 to 2026 spine.
    columns:
      - name: date_id
        description: Date id as yyyymmdd integer.
        tests: [not_null, unique]
      - name: date
        description: Calendar date.
        tests: [not_null]
      - name: year
        description: Year number.
      - name: month
        description: Month number 1 to 12.
      - name: day
        description: Day of month.

  - name: dim_driver
    description: SCD2 driver dimension from drivers_snapshot. Surrogate key is md5 of driver_id plus valid_from.
    columns:
      - name: driver_sk
        description: Surrogate key md5 driver_id plus valid_from.
        tests: [not_null, unique]
      - name: driver_id
        description: Natural key drivers.driver_id.
        tests: [not_null]
      - name: driver_name
        description: Full name.
      - name: employment_status
        description: Employment status.
      - name: region
        description: Home terminal region.
      - name: valid_from
        description: SCD valid from timestamp from dbt_valid_from.
        tests: [not_null]
      - name: valid_to
        description: SCD valid to timestamp, 9999-12-31 when current.
        tests: [not_null]
      - name: is_current
        description: True when valid_to is current sentinel, derived from dbt_valid_to is null.

  - name: dim_vehicle
    description: SCD2 vehicle dimension from vehicles_snapshot.
    columns:
      - name: vehicle_sk
        description: Surrogate key md5 truck_id plus valid_from.
        tests: [not_null, unique]
      - name: truck_id
        description: Natural key trucks.truck_id.
        tests: [not_null]
      - name: make
        description: Vehicle make lower trimmed.
      - name: model_year
        description: Model year as bigint.
      - name: status
        description: Vehicle status.
      - name: valid_from
        description: SCD valid from.
        tests: [not_null]
      - name: valid_to
        description: SCD valid to.
        tests: [not_null]
      - name: is_current
        description: True when current version.

  - name: fct_orders
    description: Orders fact from stg_loads, grain load_id. Join to SCD2 dims on event timestamp between valid_from and valid_to if promoted.
    columns:
      - name: order_id
        description: Natural key loads.load_id.
        tests: [not_null, unique]
      - name: customer_id
        description: FK to dim_customer.customer_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: route_id
        description: FK to dim_route.route_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_route')
                field: route_id
      - name: date_id
        description: FK to dim_date.date_id derived from load_date.
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id

  - name: fct_shipments
    description: Shipments fact from stg_trips, grain trip_id. When joining to dim_driver or dim_vehicle use dispatch date between valid_from and valid_to.
    columns:
      - name: shipment_id
        description: Natural key trips.trip_id.
        tests: [not_null, unique]
      - name: order_id
        description: FK to fct_orders.order_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: driver_id
        description: FK to dim_driver.driver_id for SCD2 lookup, nullable.
      - name: truck_id
        description: FK to dim_vehicle.truck_id for SCD2 lookup, nullable.
        tests:
          - relationships:
              arguments:
                to: ref('dim_vehicle')
                field: truck_id
      - name: date_id
        description: FK to dim_date.date_id derived from dispatch_date.
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id

  - name: fct_deliveries
    description: Delivery events fact from stg_delivery_events, grain event_id.
    columns:
      - name: delivery_id
        description: Natural key delivery_events.event_id.
        tests: [not_null, unique]
      - name: order_id
        description: FK to fct_orders.order_id.
        tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: shipment_id
        description: FK to fct_shipments.shipment_id.
        tests:
          - relationships:
              arguments:
                to: ref('fct_shipments')
                field: shipment_id
      - name: warehouse_id
        description: FK to dim_warehouse.warehouse_id.
        tests:
          - relationships:
              arguments:
                to: ref('dim_warehouse')
                field: warehouse_id
      - name: date_id
        description: FK to dim_date.date_id derived from event_ts.
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
