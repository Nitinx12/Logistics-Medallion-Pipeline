name: freightlake
version: "0.1.0"
config-version: 2

profile: freightlake

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: target
clean-targets: [target, dbt_packages, logs]

models:
  freightlake:
    silver:
      +materialized: incremental
      +incremental_strategy: merge
      +file_format: delta
    gold:
      +materialized: table
      +file_format: delta

# When running with --target local (duckdb) override file_format to none and
# use table materialization so dbt-duckdb does not try to write Delta files.
on-run-start:
  - "{% if target.name == 'local' %}{% do log('Running in local DuckDB mode — bronze sources read from delta/bronze/*.parquet', info=True) %}{% endif %}"

vars:
  # Used by macros or models that need to know target type at runtime
  is_local_target: "{{ target.name == 'local' }}"

snapshots:
  freightlake:
    +strategy: timestamp
    +updated_at: updated_at
    +target_schema: "{{ env_var('DATABRICKS_SCHEMA_SILVER', 'silver') }}"
