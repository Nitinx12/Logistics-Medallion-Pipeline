[project]
name = "freightlake"
version = "0.1.0"
description = "Portfolio-grade end-to-end logistics ETL pipeline using MongoDB, PostgreSQL, and Databricks with a Bronze–Silver–Gold architecture, orchestrated by Airflow and containerized with Docker."
readme = "README.md"
authors = [
    { name = "Nitin", email = "nitin321x@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "databricks-sdk>=0.137.0",
    "databricks-sql-connector>=4.5.0",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pymongo>=4.18.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
freightlake = "freightlake:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
