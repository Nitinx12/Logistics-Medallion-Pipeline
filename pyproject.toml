[project]
name = "freightlake"
version = "0.1.0"
description = "Portfolio-grade end-to-end logistics ETL pipeline using MongoDB, PostgreSQL, and Databricks with a Bronze–Silver–Gold architecture, orchestrated by Airflow and containerized with Docker."
readme = "README.md"
authors = [
    { name = "Nitin", email = "nitin321x@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "databricks-sdk>=0.68,<0.118",
    "databricks-sql-connector>=4.1.1,<4.4.1",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=25.0.1",
    "pymongo>=4.18.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
freightlake = "freightlake:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.sqlfluff.templater.jinja.context.target]
type = "databricks"
name = "dev"

[dependency-groups]
dev = [
    "dbt-databricks>=1.12.0",
    "dbt-duckdb>=1.11.0",
    "mypy>=2.3.1",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.6",
    "sqlfluff>=4.3.0",
]
