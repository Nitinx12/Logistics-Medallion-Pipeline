[project]
name = "freightlake"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nitin", email = "nitin321x@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "databricks-sql-connector[pyarrow]>=4.5.0",
    "mongo>=0.2.0",
    "polors>=0.2.4",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=25.0.1",
    "pymongo>=4.18.1",
    "pyspark>=4.2.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "dbt-databricks>=1.10.9",
    "great-expectations>=1.3.0",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "sqlfluff>=4.2.2",
    "sqlfluff-templater-dbt>=4.2.2",
]
