name: sql-lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sqlfluff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run sqlfluff lint sql --dialect postgres || echo "postgres lint done"
      - run: uv run sqlfluff lint dbt/models --dialect databricks || echo "databricks lint done"
