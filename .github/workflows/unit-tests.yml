name: unit-tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "gx/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/unit-tests.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "gx/**"
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest unit and gx demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: freight_lake
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: freight_lake
      DATABRICKS_HOST: dummy.host
      DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/dummy
      DATABRICKS_TOKEN: dapi_dummy
      DATABRICKS_CATALOG: freightlake
      DATABRICKS_SCHEMA: bronze
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: sync dependencies
        run: uv sync --all-groups

      - name: run pytest
        run: uv run pytest tests/unit tests/gx_tests -q --cov=src --cov-report=term-missing --cov-report=xml

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: gx demo validations
        run: uv run python gx/run_validations.py --demo

  airflow-dag-parse:
    name: airflow dag parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: freight_lake
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: freight_lake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: validate dags import
        run: uv run pytest tests/unit/test_dag.py -v
