name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: sync dependencies
        run: uv sync --all-groups

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: sqlfluff lint
        run: uv run sqlfluff lint

      - name: mypy type check
        run: uv run mypy . || echo "::warning::mypy found issues"
        # keep non blocking until phase 15 lint cleanup is done

      - name: pytest unit and gx suite tests
        run: uv run pytest tests/unit tests/gx_tests -q --cov --cov-report=term-missing || uv run pytest tests/unit tests/gx_tests -q

      - name: great expectations demo validations
        run: uv run python gx/run_validations.py --demo

  dbt-docs-check:
    name: dbt docs check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # no warehouse needed; parse only validates model syntax
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: sync dependencies
        run: uv sync --all-groups

      - name: dbt parse
        working-directory: dbt
        run: uv run dbt parse --profiles-dir .

      - name: dbt docs generate
        working-directory: dbt
        run: uv run dbt docs generate --profiles-dir . --no-version-check

  secrets-scan:
    name: secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check for committed secrets
        run: |
          echo "Scanning diff for likely secrets..."
          # block common secret patterns and .env files
          if git diff --name-only origin/main...HEAD 2>/dev/null | grep -q "^\.env$"; then
            echo "::error::.env file appears in diff. Remove it and use .env.example instead."
            exit 1
          fi
          # look for hardcoded tokens in staged yaml
          if grep -R --include="*.yml" --include="*.yaml" "host:.*azuredatabricks\|token:" dbt/profiles.yml 2>/dev/null | grep -v "env_var"; then
            echo "::error::dbt/profiles.yml appears to contain hardcoded credentials. Use env_var() instead."
            exit 1
          fi
          echo "No obvious secrets found."
