name: docker-build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose --env-file .env.example -f docker/compose.yml config
      - run: docker build -f docker/Dockerfile -t freightlake:ci .
      - run: docker run --rm freightlake:ci python -c "import spark_jobs.utils.logger; print('import smoke ok')"
