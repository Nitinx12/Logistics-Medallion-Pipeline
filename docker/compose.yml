name: freightlake

services:
  postgres:
    image: postgres:16-alpine
    container_name: freightlake-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-changeme}
      POSTGRES_DB: postgres
      # 02_oltp_schema.sh reads these two directly (not just POSTGRES_USER/PASSWORD,
      # which are only consumed by the base image's own init). Without them the
      # GRANT ... TO "$POSTGRES_OLTP_USER" statement builds an empty identifier.
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_OLTP_USER: ${POSTGRES_OLTP_USER:-freightlake_oltp_user}
    ports:
      # 5434 sits inside Windows Hyper-V excluded range 5433-5532 (netsh show excludedportrange)
      # use 55432 to avoid "socket in a way forbidden" bind error on Windows
      - "${POSTGRES_DOCKER_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/init:/docker-entrypoint-initdb.d:ro
      - ../sql/oltp_schema:/tmp/oltp_schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d postgres"]
      interval: 5s
      retries: 20
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: freightlake-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme}
    ports:
      - "${MONGO_DOCKER_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Plain `ping` doesn't require auth in Mongo, even once --auth is
      # enabled, so it reports healthy before the root user is actually
      # created and the auth-enabled mongod has finished restarting.
      # Authenticate here so "healthy" reflects real readiness.
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_INITDB_ROOT_USERNAME:-root}", "-p", "${MONGO_INITDB_ROOT_PASSWORD:-changeme}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 10

  airflow-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER:-airflow}:${POSTGRES_AIRFLOW_PASSWORD:-changeme}@postgres:5432/${POSTGRES_AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USERNAME:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-changeme} --firstname Admin --lastname User --role Admin --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.com} || true"

  airflow-webserver:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: freightlake-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER:-airflow}:${POSTGRES_AIRFLOW_PASSWORD:-changeme}@postgres:5432/${POSTGRES_AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8090}:8080"
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../spark_jobs:/opt/airflow/spark_jobs:ro
      - ../dbt:/opt/airflow/dbt:ro
      - airflow_logs:/opt/airflow/logs
    command: airflow webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      retries: 10

  airflow-scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: freightlake-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-webserver:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER:-airflow}:${POSTGRES_AIRFLOW_PASSWORD:-changeme}@postgres:5432/${POSTGRES_AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../spark_jobs:/opt/airflow/spark_jobs:ro
      - ../dbt:/opt/airflow/dbt:ro
      - airflow_logs:/opt/airflow/logs
    command: airflow scheduler

  dag-processor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: freightlake-airflow-dag-processor
    restart: unless-stopped
    depends_on:
      airflow-webserver:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER:-airflow}:${POSTGRES_AIRFLOW_PASSWORD:-changeme}@postgres:5432/${POSTGRES_AIRFLOW_DB:-airflow}
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
    command: airflow dag-processor

volumes:
  postgres_data:
  mongo_data:
  airflow_logs:
